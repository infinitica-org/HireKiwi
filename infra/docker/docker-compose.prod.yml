# HireKiwi — Production & Staging Docker Compose Topology
# Purpose: Full stack deployment for single Linux VPS (Dev & Prod stacks with Blue-Green switching).
# Each application is independently containerized and can be built, scaled, or updated individually.
#
# Usage:
#   docker compose --env-file .env.prod -f infra/docker/docker-compose.prod.yml --profile apps --profile vps up -d
#   Deploy single app:
#     docker compose --env-file .env.prod -f infra/docker/docker-compose.prod.yml build web-student
#     docker compose --env-file .env.prod -f infra/docker/docker-compose.prod.yml up -d --no-deps web-student

name: hirekiwi

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: postgresql://hirekiwi:${POSTGRES_PASSWORD:-hirekiwi}@postgres:5432/hirekiwi?schema=public
  POOLED_DATABASE_URL: postgresql://hirekiwi:${POSTGRES_PASSWORD:-hirekiwi}@pgbouncer:6432/hirekiwi?schema=public
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: redpanda:9092
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-now!!}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost:3008,http://localhost}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hirekiwi}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hirekiwisecret}
  S3_BUCKET: hirekiwi
  S3_ENCRYPTION: ${S3_ENCRYPTION:-off}
  FILE_SCAN: ${FILE_SCAN:-off}
  CLAMD_HOST: clamav
  LOG_PRETTY: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: HireKiwi Platform <noreply@hirekiwi.local>
  AUTH_APP_URL: ${AUTH_APP_URL:-http://localhost:3005}
  STUDENT_APP_URL: ${STUDENT_APP_URL:-http://localhost:3001}
  TPO_APP_URL: ${TPO_APP_URL:-http://localhost:3002}
  ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:3003}
  COMPANY_APP_URL: ${COMPANY_APP_URL:-http://localhost:3006}
  LANDING_APP_URL: ${LANDING_APP_URL:-http://localhost:3007}
  DOCS_APP_URL: ${DOCS_APP_URL:-http://localhost:3008}
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_MONTHLY_CEILING_USD: ${AI_MONTHLY_CEILING_USD:-500}
  PROCTORING_FULL: ${PROCTORING_FULL:-true}
  PROCTORING_CV_URL: ${PROCTORING_CV_URL:-http://proctoring-cv:8091}
  PROCTORING_CV_PROVIDER: ${PROCTORING_CV_PROVIDER:-stub}
  CREDENTIAL_VERIFIER_URL: ${CREDENTIAL_VERIFIER_URL:-http://credential-verifier:3100}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirekiwi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirekiwi}
      POSTGRES_DB: hirekiwi
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirekiwi -d hirekiwi"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hirekiwi:${POSTGRES_PASSWORD:-hirekiwi}@postgres:5432/hirekiwi
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=${POSTGRES_PASSWORD:-hirekiwi} psql -h 127.0.0.1 -p 6432 -U hirekiwi -d hirekiwi -c 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-512mb}",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --mode
      - dev-container
      - --unsafe-bypass-fsync=false
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eiq 'Healthy|ok'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hirekiwi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hirekiwisecret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3001,http://127.0.0.1:3001,https://dev.app.hirekiwi.online}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      KMS_ENABLED: ${MINIO_KMS_SECRET_KEY:+true}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-hirekiwi} ${MINIO_ROOT_PASSWORD:-hirekiwisecret} &&
      mc mb --ignore-existing local/hirekiwi &&
      if [ \"$$KMS_ENABLED\" = true ]; then mc encrypt set sse-s3 local/hirekiwi; fi
      "

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles: ["scan"]
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8025/api/v1/info",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.prisma-studio
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../apps/api-core/prisma:/app/prisma:ro
      - ../../apps/api-core/prisma.config.ts:/app/prisma.config.ts:ro
    environment:
      DATABASE_URL: postgresql://hirekiwi:${POSTGRES_PASSWORD:-hirekiwi}@postgres:5432/hirekiwi?schema=public
    ports:
      - "127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555"
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["apps"]

  # ---------------------------------------------------------------------------
  # APPLICATIONS (Independently containerized services)
  # ---------------------------------------------------------------------------

  api:
    build:
      context: ../..
      dockerfile: apps/api-core/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    profiles: ["apps"]

  credential-verifier-db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-hirekiwi}
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U hirekiwi -d hirekiwi -tc \"SELECT 1 FROM pg_database WHERE datname = 'credential_verifier'\" | grep -q 1 ||
      psql -h postgres -U hirekiwi -d hirekiwi -c \"CREATE DATABASE credential_verifier OWNER hirekiwi\"
      "
    profiles: ["apps"]

  credential-verifier:
    build:
      context: ../..
      dockerfile: apps/credential-verifier/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3100"
      DATABASE_URL: postgresql://hirekiwi:${POSTGRES_PASSWORD:-hirekiwi}@postgres:5432/credential_verifier?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3004,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      credential-verifier-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CREDENTIAL_VERIFIER_PORT:-3100}:3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/docs-json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    profiles: ["apps"]

  proctoring-cv:
    build:
      context: ../../apps/proctoring-cv
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROCTORING_CV_PROVIDER: ${PROCTORING_CV_PROVIDER:-real}
      PROCTORING_CV_PORT: "8091"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-hirekiwi}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${PROCTORING_CV_PORT:-8091}:8091"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
    profiles: ["apps"]

  web-student:
    build:
      context: ../..
      dockerfile: apps/web-student/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${STUDENT_PORT:-3001}:3000"
    profiles: ["apps"]

  web-tpo:
    build:
      context: ../..
      dockerfile: apps/web-tpo/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${TPO_PORT:-3002}:3000"
    profiles: ["apps"]

  web-admin:
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3003}:3000"
    profiles: ["apps"]

  web-verify:
    build:
      context: ../..
      dockerfile: apps/web-verify/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${VERIFY_PORT:-3004}:3000"
    profiles: ["apps"]

  web-auth:
    build:
      context: ../..
      dockerfile: apps/web-auth/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${AUTH_PORT:-3005}:3000"
    profiles: ["apps"]

  web-company:
    build:
      context: ../..
      dockerfile: apps/web-company/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${COMPANY_PORT:-3006}:3000"
    profiles: ["apps"]

  web-landing:
    build:
      context: ../..
      dockerfile: apps/web-landing/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${LANDING_PORT:-3007}:3000"
    profiles: ["apps"]

  web-docs:
    build:
      context: ../..
      dockerfile: apps/web-docs/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${DOCS_PORT:-3008}:3000"
    profiles: ["apps"]

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE SERVICES (VPS, BACKUP, CADDY REVERSE PROXY)
  # ---------------------------------------------------------------------------

  backup:
    build:
      context: ../backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_ENV_NAME: ${BACKUP_ENV_NAME:-local}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 20 * * *}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_DEST: ${BACKUP_DEST:-offsite:hirekiwi-backups}
      BACKUP_INCLUDE_OBJECTS: ${BACKUP_INCLUDE_OBJECTS:-true}
      PGHOST: postgres
      PGUSER: hirekiwi
      PGDATABASE: hirekiwi
      PGPASSWORD: ${POSTGRES_PASSWORD:-hirekiwi}
      MINIO_BUCKET: hirekiwi
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-hirekiwi}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-hirekiwisecret}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - backup_work:/work
      - backup_metrics:/metrics
    profiles: ["vps"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDENT_HOST: ${STUDENT_HOST:-app.localhost}
      TPO_HOST: ${TPO_HOST:-tpo.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      VERIFY_HOST: ${VERIFY_HOST:-verify.localhost}
      AUTH_HOST: ${AUTH_HOST:-auth.localhost}
      COMPANY_HOST: ${COMPANY_HOST:-company.localhost}
      LANDING_HOST: ${LANDING_HOST:-landing.localhost}
      DOCS_HOST: ${DOCS_HOST:-docs.localhost}
      API_HOST: ${API_HOST:-api.localhost}
      STUDIO_HOST: ${STUDIO_HOST:-studio.localhost}
      DB_HOST: ${DB_HOST:-db.localhost}
      DB_BASIC_AUTH_USER: ${DB_BASIC_AUTH_USER:-admin}
      DB_BASIC_AUTH_HASH: ${DB_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web-student
      - web-tpo
      - web-admin
      - web-verify
      - web-auth
      - web-company
      - web-landing
      - web-docs
      - prisma-studio
      - adminer
    profiles: ["vps"]

  # ---------------------------------------------------------------------------
  # OBSERVABILITY STACK
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment:
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$METRICS_SCRAPE_TOKEN" > /tmp/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --web.enable-remote-write-receiver
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-hirekiwi}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@hirekiwi.local}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:9/alert-webhook-not-configured}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-mailpit:1025}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-alerts@hirekiwi.local}
      GF_SMTP_FROM_NAME: HireKiwi alerts
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3100}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    profiles: ["obs"]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3101}:3100"
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    profiles: ["obs"]

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    profiles: ["obs"]

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3103}:3200"
      - "127.0.0.1:${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    profiles: ["obs"]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8085}:8080"
    profiles: ["obs"]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - backup_metrics:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9101}:9100"
    profiles: ["obs"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://hirekiwi:${POSTGRES_PASSWORD:-hirekiwi}@postgres:5432/hirekiwi?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    profiles: ["obs"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.90.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
    profiles: ["obs"]

volumes:
  clamav_data:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
  backup_work:
  backup_metrics:
