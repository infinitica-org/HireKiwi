name: Deploy prod (Single VPS Blue-Green)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: Run production seed after deploy (uses SEED_* from .env.prod)
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run.branches is not enough — CI on other default-branch SHAs
    # can still fire this listener. Only deploy when CI ran on `main`.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repository to Single VPS
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='.turbo' \
            --exclude='**/.next' \
            --exclude='**/dist' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:~/hirekiwi/"

      - name: Write .env.prod from GitHub secret
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "${PROD_ENV_FILE}" || {
            echo "PROD_ENV_FILE secret is empty — Production needs ~/hirekiwi/.env.prod"
            exit 1
          }
          printf '%s\n' "${PROD_ENV_FILE}" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            'umask 077; mkdir -p ~/hirekiwi; cat > ~/hirekiwi/.env.prod; chmod 600 ~/hirekiwi/.env.prod'

      - name: Blue-Green Zero-Downtime Deploy + migrate + health check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            'cd ~/hirekiwi && bash scripts/blue-green-deploy.sh prod'

      - name: Seed production accounts
        if: github.event_name == 'workflow_dispatch' && inputs.seed
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            'cd ~/hirekiwi && bash scripts/seed-vps.sh prod'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
