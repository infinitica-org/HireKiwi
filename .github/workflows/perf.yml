name: Performance

# Manual-trigger by default. Load, stress, spike, and soak runs require
# dedicated capacity to avoid resource contention with active dev/prod stacks.
# Smoke is cheap enough (15 VUs, 3 min) to run on `workflow_dispatch` for a PR.
# Run on-demand or during scheduled performance testing windows.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which stress:<profile> script to run"
        required: true
        default: smoke
        type: choice
        options: [smoke, baseline, load, stress, spike, soak]
  # schedule:
  #   - cron: '0 3 * * *'   # nightly soak, opt in explicitly when ready

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf (${{ github.event.inputs.profile || 'smoke' }})
    runs-on: ubuntu-latest
    # soak's default is 4h; keep this above the longest profile you intend to
    # run via workflow_dispatch, well below the runner's other obligations.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-pnpm

      - name: install k6
        run: |
          set -euo pipefail
          if command -v k6 >/dev/null 2>&1; then exit 0; fi
          curl -fsSL https://github.com/grafana/k6/releases/latest/download/k6-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin '*/k6'

      - name: stress:up (apps + obs profiles)
        run: pnpm stress:up

      - name: wait for services
        run: pnpm stress:wait

      - name: seed test data
        run: pnpm stress:seed
        env:
          TEST_DATA_USERS: 50

      - name: run profile
        run: pnpm "stress:${{ github.event.inputs.profile || 'smoke' }}"

      - name: upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-${{ github.event.inputs.profile || 'smoke' }}
          path: tools/load-tests/summary-*.json
          if-no-files-found: warn

      - name: stress:down
        if: always()
        run: pnpm stress:down
