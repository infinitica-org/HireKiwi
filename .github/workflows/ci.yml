name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Enterprise Quality Gate: single fast job with Turbo caching across all targets
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: lockfile
        run: node scripts/check-lockfile.mjs

      - name: verify-target-mergeability
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          TARGET_BASE="${{ github.base_ref }}"
          echo "Verifying PR cleanly merges with base: origin/${TARGET_BASE}"
          git fetch --no-tags origin "${TARGET_BASE}"
          if ! git merge-tree --write-tree "origin/${TARGET_BASE}" HEAD >/dev/null; then
            echo "::error::This branch has merge conflicts with origin/${TARGET_BASE}. Rebase or merge origin/${TARGET_BASE} locally before landing."
            git merge-tree --write-tree --messages "origin/${TARGET_BASE}" HEAD || true
            exit 1
          fi

      - name: compose config
        run: docker compose -f infra/docker/docker-compose.yml --profile apps --env-file .env.example config

      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: lint
        run: pnpm lint

      - name: format
        run: pnpm format:check

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test:unit

      - name: build
        # Uses default concurrency for GitHub-hosted runner
        run: pnpm exec turbo run build

  # S8-TN-05: Database migration verification + schema drift detection gate.
  # Executes all Prisma migrations against a clean PostgreSQL (pgvector) container,
  # checks that migrations match schema.prisma with zero drift, and verifies seeds.
  # Prevents arbitrary column changes or broken migrations from entering `dev`.
  db-migrations:
    name: db-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smart
          POSTGRES_PASSWORD: smart
          POSTGRES_DB: smart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      - name: verify db migrations, schema drift & seeds
        env:
          DATABASE_URL: postgresql://smart:smart@127.0.0.1:5432/smart?schema=public
        run: node scripts/verify-db-migrations.mjs
