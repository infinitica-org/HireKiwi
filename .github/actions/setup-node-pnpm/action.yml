name: Setup Node + pnpm
description: Checkout-adjacent toolchain for HireKiwi CI (Node 22 from .nvmrc, pnpm 11.22)
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5
      with:
        version: 11.22.0
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm turbo run build --filter=@hirekiwi/api-core^... --filter=@hirekiwi/credential-verifier^...
    - shell: bash
      env:
        DATABASE_URL: postgresql://hirekiwi:hirekiwi@127.0.0.1:5432/hirekiwi?schema=public
      run: pnpm --filter @hirekiwi/api-core db:generate
    - shell: bash
      env:
        DATABASE_URL: postgresql://hirekiwi:hirekiwi@127.0.0.1:5432/hirekiwi?schema=public
      run: pnpm --filter @hirekiwi/credential-verifier db:generate
